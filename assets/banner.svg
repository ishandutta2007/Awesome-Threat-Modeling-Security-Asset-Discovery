<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="45%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#181335" />
    </linearGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="scan-laser" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0)" />
      <stop offset="50%" stop-color="rgba(56, 189, 248, 0.45)" />
      <stop offset="100%" stop-color="rgba(56, 189, 248, 0)" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.25)" />
      <stop offset="100%" stop-color="rgba(192, 132, 252, 0.15)" />
    </linearGradient>

    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Keyframe Animations -->
    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.65); opacity: 0.9; }
        50% { transform: scale(1.25); opacity: 0.25; }
        100% { transform: scale(1.85); opacity: 0; }
      }
      @keyframes scanVert {
        0% { transform: translateY(-30px); }
        50% { transform: translateY(350px); }
        100% { transform: translateY(-30px); }
      }
      @keyframes floatNode1 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-9px) scale(1.15); }
      }
      @keyframes floatNode2 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(8px) scale(1.12); }
      }
      @keyframes floatNode3 {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-6px) scale(1.2); }
      }
      @keyframes cyberGlow {
        0%, 100% { opacity: 0.35; }
        50% { opacity: 0.75; }
      }

      .radar-center {
        transform-origin: 980px 180px;
      }
      .pulse-1 {
        transform-origin: 980px 180px;
        animation: pulseRing 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
      }
      .pulse-2 {
        transform-origin: 980px 180px;
        animation: pulseRing 4s cubic-bezier(0.215, 0.61, 0.355, 1) infinite 2s;
      }
      .laser-bar {
        animation: scanVert 7s ease-in-out infinite;
      }
      .node-orbit-1 { animation: floatNode1 3.5s ease-in-out infinite; }
      .node-orbit-2 { animation: floatNode2 4.2s ease-in-out infinite 0.7s; }
      .node-orbit-3 { animation: floatNode3 3.8s ease-in-out infinite 1.4s; }
      .glow-layer { animation: cyberGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="18" />
  <rect width="1200" height="360" fill="url(#grid-pattern)" rx="18" />

  <!-- Dynamic Asset Discovery & Threat Map Radar (Strictly in Right Background) -->
  <g opacity="0.45">
    <circle cx="980" cy="180" r="145" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="5,5" />
    <circle cx="980" cy="180" r="105" fill="none" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="980" cy="180" r="60" fill="none" stroke="#c084fc" stroke-width="1.2" stroke-dasharray="3,3" />
    <circle cx="980" cy="180" r="22" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Crosshairs -->
    <line x1="820" y1="180" x2="1140" y2="180" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
    <line x1="980" y1="25" x2="980" y2="335" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />

    <!-- Pulse Rings -->
    <circle class="pulse-1" cx="980" cy="180" r="60" fill="none" stroke="#38bdf8" stroke-width="2" />
    <circle class="pulse-2" cx="980" cy="180" r="60" fill="none" stroke="#818cf8" stroke-width="2" />
  </g>

  <!-- Dynamic Security Topology Nodes -->
  <g class="node-orbit-1" opacity="0.85">
    <circle cx="900" cy="110" r="6" fill="#38bdf8" />
    <line x1="900" y1="110" x2="980" y2="180" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>
  <g class="node-orbit-2" opacity="0.85">
    <circle cx="1065" cy="125" r="5" fill="#f43f5e" />
    <line x1="1065" y1="125" x2="980" y2="180" stroke="rgba(244, 63, 94, 0.35)" stroke-width="1.5" />
  </g>
  <g class="node-orbit-3" opacity="0.85">
    <circle cx="935" cy="255" r="7" fill="#4ade80" />
    <line x1="935" y1="255" x2="980" y2="180" stroke="rgba(74, 222, 128, 0.35)" stroke-width="1.5" stroke-dasharray="3,3" />
  </g>
  <g class="node-orbit-1" opacity="0.8">
    <circle cx="1055" cy="245" r="5" fill="#c084fc" />
    <line x1="1055" y1="245" x2="980" y2="180" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.5" />
  </g>

  <!-- Vertical Laser Scan Line (Kept very subtle so foreground text is crystal clear) -->
  <rect class="laser-bar" x="0" y="0" width="1200" height="35" fill="url(#scan-laser)" opacity="0.45" />

  <!-- Shield Shield Contour in Background -->
  <path d="M 980 120 L 1025 140 L 1025 185 C 1025 215 980 235 980 235 C 980 235 935 215 935 185 L 935 140 Z" 
        fill="url(#shield-grad)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" opacity="0.65" />

  <!-- FOREGROUND BRANDING (Protected & Positioned for Maximum Visibility) -->
  <g transform="translate(65, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="52" width="285" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
    <text x="16" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="12.5" font-weight="700" fill="#38bdf8" letter-spacing="1">🛡️ CYBER THREAT MODELING &amp; ASM</text>

    <!-- Main Title Lines -->
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="url(#title-grad)" letter-spacing="-0.5">Threat Modeling &amp;</text>
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">Security Asset Discovery</text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="242" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated Ecosystem of Threat-Modeling-as-Code, Attack Surface Management (ASM) &amp; Risk Intelligence
    </text>

    <!-- Highlights Tag Pills -->
    <g transform="translate(0, 274)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">⚡ STRIDE &amp; PASTA</text>

      <rect x="142" y="0" width="140" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="152" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🎯 Attack Surface</text>

      <rect x="294" y="0" width="135" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="304" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🔍 Attack Graphs</text>

      <rect x="441" y="0" width="145" height="26" rx="6" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="451" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">💻 27+ OSS Tools</text>
    </g>
  </g>
</svg>
